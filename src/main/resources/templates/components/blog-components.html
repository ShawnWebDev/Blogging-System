<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Components</title>
</head>
<body>

<!--blog dashboard components-->
<section th:fragment="all-posts" id="posts">
    <header>
        <button th:if="${categoryName != 'All'}" hx-get="/blog/posts" hx-target="#posts" hx-swap="outerHTML swap:150ms" class="btn-secondary" hx-on:click="removeActiveCategories()">Remove Filter</button>
        <h2 th:if="${categoryName != 'All'}" th:text="${'Posts in ' + categoryName + ' category'}"></h2>
        <h2 th:unless="${categoryName != 'All'}">All Blog Posts</h2>
        <p th:text="${categoryDesc}"></p>
    </header>

    <section id="post-container">
        <article th:each="post : ${posts}" class="post-card">
            <header>
                    <h4>
                        <span th:text="${post.title}"></span>
                        <span class="header-nav-arrow">
                            &#8594;
                        </span>
                    </h4>
                    <a th:href="@{/blog/post/{id}/{slug}(id = ${post.id}, slug = ${post.slug})}" th:hx-get="@{/blog/post/{id}/{slug}(id = ${post.id}, slug = ${post.slug})}" hx-target="#main-content" hx-swap="outerHTML swap:150ms">
                        <span>View Post</span>
                    </a>
                <small><time th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}"></time></small>
            </header>
            <section class="description">
                <img th:if="${!post.thumbnailUrl.isBlank()}" th:src="${post.thumbnailUrl}" th:alt="${post.thumbnailAlt}" class="post-thumbnail"/>
                <p th:text="${post.description}"></p>
            </section>
        </article>
    </section>
</section>

<section th:fragment="categories" id="categories">
    <h3>Filter by category:</h3>
        <div id="categories-container">
            <button th:each="category : ${categories}"
                    th:class="|category-selection btn-secondary ${param.categoryName != null && param.categoryName[0]==category.name ? 'active-category' : ''}|"
                    th:hx-get="@{/blog/posts(categoryName=${category.name})}"
                    hx-target="#posts"
                    hx-swap="outerHTML swap:150ms"
                    th:text="${category.name}"
                    th:title="'View posts in ' + ${category.name} + '.'"
                    th:disabled="${param.categoryName != null && param.categoryName[0]==category.name}">
            </button>
        </div>
    <script>
        function removeActiveCategories() {
            document.querySelectorAll('.category-selection').forEach((el) => {
                el.classList.remove('active-category');
                el.disabled = false;
            })
        }
        document.getElementById('categories-container').addEventListener('click', function (e) {
            const target = e.target.closest('.category-selection');
            if (target) {
                removeActiveCategories();
                target.classList.add('active-category');
                target.disabled = true;
            }
        });
    </script>
</section>

</body>
</html>
