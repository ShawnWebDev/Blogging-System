<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Components</title>
</head>
<body>

<!--blog dashboard components-->
<section th:fragment="all-posts" id="posts">
    <header>
        <h3 th:text="${categoryName + ' Posts'}"></h3>
        <small th:if="${categoryDesc != null}" th:text="${categoryDesc}"></small>
        <a th:if="${categoryName != 'All'}" hx-get="/blog/blogComponent/posts" hx-target="#posts" hx-swap="outerHTML swap:200ms" class="">Back to all posts</a>
    </header>

    <section id="post-container">
        <article th:each="post : ${posts}" class="post-card">
            <header>
                <h4>
                    <a th:text="${post.title}" th:hx-get="@{/blog/post/id/{id}(id = ${post.id})}" hx-target="#main-content" hx-swap="outerHTML" class="post-selection"></a>
                </h4>
                <small>@ <time th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}"></time></small>
            </header>
            <section class="post-description" th:if="${post.thumbnailUrl != null && post.thumbnailAlt != null}">
                <img th:src="${post.thumbnailUrl}" th:alt="${post.thumbnailAlt}"/>
                <p th:text="${post.description}"></p>
            </section>
            <footer>
                <ul class="group">
                    <li th:each="category : ${post.categories}">
                        <small th:text="${category}"></small>
                    </li>
                </ul>
            </footer>
        </article>
    </section>
</section>

<section th:fragment="categories" id="categories">
    <header>
        <h2>Filter By Category</h2>
    </header>
    <div id="categories-container">
        <button class="category-selection btn-primary"
                th:each="category : ${categories}"
                th:hx-get="@{/blog/blogComponent/posts(categoryName=${category.categoryName})}"
                hx-target="#posts"
                hx-swap="outerHTML swap:200ms"
                th:text="${category.categoryName}">
        </button>
    </div>
</section>

</body>
</html>
