<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Components</title>
</head>
<body>

<!--All blog posts-->
<section th:fragment="all-posts" id="posts">
    <header>
        <h4 th:text="${postsHeading}"></h4>
        <a th:if="${postsHeading != 'All Posts'}" hx-get="/blog/blogComponent/posts" hx-target="#posts" hx-swap="outerHTML swap:200ms">Back to all posts</a>
    </header>
    <article th:each="post : ${posts}" class="post">
        <header>
            <h5 th:text="${post.title}"></h5>
            <span>@ <small th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}"></small></span>
        </header>

        <section class="post-description">
            <img th:src="${post.thumbnailUrl}" th:alt="${post.thumbnailAlt}"/>
            <p th:text="${post.description}"></p>
        </section>


        <footer>
            <small th:each="category : ${post.categories}">
                <a th:hx-get="@{/blog/blogComponent/posts(category=${category})}" hx-target="#posts" hx-swap="outerHTML swap:200ms" th:text="${category}"/>
            </small>
        </footer>
    </article>
</section>



</body>
</html>
