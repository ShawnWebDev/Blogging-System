<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Components</title>
</head>
<body>

<!--All blog posts-->
<section th:fragment="all-posts" id="posts">

    <header>
        <h3 th:text="${postsHeading}"></h3>
        <a th:if="${postsHeading != 'All Posts'}" hx-get="/blog/blogComponent/posts" hx-target="#posts" hx-swap="outerHTML swap:200ms">Back to all posts</a>
    </header>

    <section id="post-container">
        <article th:each="post : ${posts}" class="post">
            <header>
                <h5 th:text="${post.title}"></h5>
                <small>@ <time th:text="${#temporals.format(post.createdAt, 'MMMM dd, yyyy')}"></time></small>
            </header>

            <section class="post-description">
                <img th:src="${post.thumbnailUrl}" th:alt="${post.thumbnailAlt}"/>
                <p th:text="${post.description}"></p>
            </section>

            <footer>
                <nav>
                    <ul>
                        <li th:each="category : ${post.categories}">
                            <small><a th:hx-get="@{/blog/blogComponent/posts(category=${category})}" hx-target="#posts" hx-swap="outerHTML swap:200ms" th:text="${category}"/></small>
                        </li>
                    </ul>
                </nav>
            </footer>
        </article>
    </section>

</section>



</body>
</html>
