<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

  <div th:fragment="comment-form-enabled">
    <p>enabled comment form will be here....</p>
  </div>


  <div th:fragment="comment-form-disabled">
    <p>disabled comment form will be here....</p>
  </div>


  <section th:fragment="comment-section" id="comments">
    <h3>Comments...</h3>
    <p>This will be within each blog post (Will be own component)</p>

    <div hx-trigger="logoutSuccess from:body" hx-get="/blog/blogComponent/removeCommentForm" hx-swap="innerHTML" hx-target="#comment-form-container"></div>
    <div hx-trigger="loginSuccess from:body" hx-get="/blog/blogComponent/commentForm" hx-swap="innerHTML" hx-target="#comment-form-container"></div>

    <div id="comment-form-container">
      <div sec:authorize="isAuthenticated()" th:replace="~{components/comment-components :: comment-form-enabled}"></div>
      <div sec:authorize="isAnonymous()" th:replace="~{components/comment-components :: comment-form-disabled}"></div>
    </div>
  </section>


</body>
</html>
