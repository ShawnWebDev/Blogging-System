<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <div th:fragment="size-count" id="size-count" hx-swap-oob="true">
        <span th:text="${size}"></span><span> characters used.</span>
    </div>

    <section th:fragment="admin-buttons(id)" id="admin-edit-post-btns" hx-trigger="loginSuccess from:body" th:hx-get="@{/blog/postComponent/adminButtons(id=${id})}" hx-target="this" hx-swap="outerHTML">
        <div sec:authorize="hasAuthority('ADMIN')">
            <button th:hx-get="@{/blog/post/editPost/{id}(id=${id})}" hx-target="#main-content" hx-swap="outerHTML" class="btn-primary">Edit</button>
            <button th:hx-delete="@{/blog/post/deletePost/{id}(id=${id})}" hx-target="#main-content" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete this post?" class="btn-primary">Delete</button>
        </div>
    </section>

    <li th:fragment="img-url" th:text="${imgUrl}"></li>

    <dialog th:fragment="img-upload(postId)" id="img-upload">
        <article>
            <header>
                <span id="login-dialog-title">Upload Image</span>
                <button title="Close" aria-label="Close" onclick="closeDialog('img-upload')" class="close-btn btn-primary">X</button>
            </header>
            <form action="#" th:hx-post="@{/admin/upload-image}" id="upload-image-form" hx-target="#img-urls" hx-swap="afterbegin" enctype="multipart/form-data">
                <label>Folder:
                    <input type="text" name="folder" required>
                </label>
                <label>Image:
                    <input type="file" name="file" required>
                </label>
                <button type="submit" class="btn-primary">Upload Image</button>
            </form>
        </article>
        <p>Uploaded:</p>
        <ul id="img-urls">
            <li th:each="img : ${uploadedImageUrls}" th:text="${img.url}"></li>
        </ul>
    </dialog>
</body>
</html>
