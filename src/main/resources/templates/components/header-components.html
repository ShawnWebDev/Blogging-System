<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <header th:fragment="full-header" id="main-header">
    <h1 id="header">Shawn Osborne</h1>
    <nav>
      <ul>
        <li>
          <button hx-get="/" hx-target="#main-content" hx-swap="outerHTML">About Me</button>
        </li>
        <li>
          <button hx-get="/" hx-target="#main-content">Portfolio</button>
        </li>
        <li>
          <button hx-get="/blog" hx-target="#main-content" hx-swap="outerHTML">Blog</button>
        </li>
        <li>
          <button hx-get="/" hx-target="#main-content">Contact</button>
        </li>
        <li>
          <div sec:authorize="isAnonymous()" th:replace="~{components/auth-components :: login-form}"></div>
          <div sec:authorize="isAuthenticated()" th:replace="~{components/auth-components :: logout-form}"></div>
        </li>
      </ul>
    </nav>
  </header>

</body>
</html>
