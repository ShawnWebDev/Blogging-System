<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <header th:fragment="full-header" id="main-header">
    <h2>Shawn Osborne</h2>
    <section>
      <h3>Hello World!</h3>
      <p>
        I'm Shawn, software engineer among many other things. Welcome to my little corner of the web.
      </p>
    </section>
    <nav>
      <ul>
        <li>
          <a hx-get="/" hx-target="#main-content" hx-swap="outerHTML" class="nav-item">About Me</a>
        </li>
        <li>
          <a hx-get="/" hx-target="#main-content" hx-swap="outerHTML" class="nav-item">Portfolio</a>
        </li>
        <li>
          <a hx-get="/blog" hx-target="#main-content" hx-swap="outerHTML" class="nav-item">Blog</a>
        </li>
        <li>
          <a hx-get="/" hx-target="#main-content" hx-swap="outerHTML" class="nav-item">Contact</a>
        </li>
      </ul>
    </nav>
    <section>
      <h4>Contact</h4>
    </section>
    <section>
      <div sec:authorize="isAnonymous()" th:replace="~{components/auth-components :: login-form}"></div>
      <div sec:authorize="isAuthenticated()" th:replace="~{components/auth-components :: logout-form}"></div>
    </section>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
          const navItems = document.querySelectorAll('.nav-item');
          navItems.forEach(item => {
            item.addEventListener('click',
              function () {
                navItems.forEach(navItem =>
                        navItem.classList.remove('active'));
                this.classList.add('active');});});});
    </script>
  </header>

</body>
</html>
