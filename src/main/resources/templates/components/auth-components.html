<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Components</title>
</head>

<body>

<div th:fragment="logout-form" class="login-container">
    <form id="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
    <button hx-post="/logout" hx-target=".login-container" hx-swap="outerHTML" hx-include="#logout-form input">Logout</button>
    <button sec:authorize="hasAuthority('ADMIN')" hx-get="/blog/createPost" hx-target="#main-content" hx-swap="innerHTML" class="btn-primary">
        Create Post
    </button>
</div>

<div th:fragment="login-form" class="login-container">
    <button onclick="getElementById('login-modal').showModal()" class="btn-primary">Login</button>
    <dialog id="login-modal" th:open="${loginError}">
        <article>
            <header>
                <strong>Please sign in to comment.</strong>
                <button aria-label="Close" onclick="getElementById('login-modal').close()" class="close-btn">X</button>
            </header>
            <form hx-post="/login" hx-target=".login-container" hx-swap="outerHTML" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>
                    Username:
                    <input type="text" name="username" placeholder="Username" required th:aria-invalid="${loginError}"/>
                </label>
                <label>
                    Password:
                    <input type="password" name="password" placeholder="Password" required th:aria-invalid="${loginError}"/>
                </label>
                <small th:if="${loginError}" class="error">Invalid username or password.</small>
                <small th:if="${logout}">You have logged out.</small>
                <input type="submit" value="Sign In"/>
            </form>
        </article>
    </dialog>
</div>

</body>
</html>
