<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Components</title>
</head>

<body>

<div th:fragment="logout-form" class="login-container">
    <form id="logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    </form>
    <a href="#" hx-post="/logout" hx-target=".login-container" hx-swap="outerHTML" hx-include="#logout-form input">Logout</a>
</div>

<div th:fragment="login-form" class="login-container">
    <a onclick="getElementById('login-modal').showModal()">Login</a>
    <dialog id="login-modal" th:open="${loginError} or ${logout}">
        <article>
            <header>
                <strong>Please sign in to comment.</strong>
                <button aria-label="Close" rel="prev" onclick="getElementById('login-modal').close()"></button>
            </header>
            <form hx-post="/login" hx-target=".login-container" hx-swap="outerHTML" method="post">
                <fieldset>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <label>
                        Username:
                        <input type="text" name="username" placeholder="Username" required th:aria-invalid="${loginError}"/>
                    </label>
                    <label>
                        Password:
                        <input type="password" name="password" placeholder="Password" required th:aria-invalid="${loginError}"/>
                    </label>
                </fieldset>
                <small th:if="${loginError}">Invalid username or password.</small>
                <small th:if="${logout}">You have logged out.</small>
                <input type="submit" value="Sign In"/>
            </form>
        </article>
    </dialog>
</div>

</body>
</html>
