<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Components</title>
</head>

<body>

    <div th:fragment="logout-button" class="login-container">
        <form id="logout-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        </form>
        <button hx-post="/logout" hx-target=".login-container" hx-swap="outerHTML" hx-include="#logout-form input">Logout</button>
        <button sec:authorize="hasAuthority('ADMIN')" hx-get="/blog/post/createPost" hx-target="#main-content" hx-swap="innerHTML" class="btn-primary">
            Create Post
        </button>
    </div>

    <div th:fragment="login-button" class="login-container">
        <button onclick="getElementById('login-modal').showModal()" class="btn-primary">Login</button>
        <small th:if="${param.logout != null}" th:text="${logout}"></small>
    </div>

    <dialog th:fragment="login-dialog" id="login-modal" th:open="${loginError ?: false}">
        <article>
            <header>
                <strong>Please sign in to comment.</strong>
                <button aria-label="Close" onclick="closeLoginForm()" class="close-btn">X</button>
            </header>
            <form hx-post="/login" hx-target=".login-container" hx-swap="outerHTML" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <label>
                    Username:
                    <input type="text" name="username" placeholder="Username" required th:aria-invalid="${loginError}"/>
                </label>
                <label>
                    Password:
                    <input type="password" name="password" placeholder="Password" required th:aria-invalid="${loginError}"/>
                </label>
                <small th:if="${loginError}" class="error">Invalid username or password.</small>
                <input type="submit" value="Sign In" onclick="closeLoginForm()" />
            </form>
        </article>
    </dialog>


</body>
</html>
