<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Components</title>
</head>

<body>

    <div th:fragment="logout-button-blog" id="login-container">
        <h4>Logged in as <span sec:authentication="name"></span>.</h4>
        <div sec:authorize="hasAuthority('ADMIN')" id="admin-btns">
            <button hx-get="/blog/post/createPost" hx-target="#main-content" hx-swap="outerHTML" class="btn-primary">
                Create Post</button>
            <button id="in-progress-btn" hx-get="/blog/blogComponent/posts/inProgress" hx-target="#posts" hx-swap="outerHTML swap:200ms" class="btn-primary">
                Get In Progress</button>
        </div>
        <button hx-post="/logout" hx-target="#login-container" hx-swap="outerHTML" class="btn-primary">Logout</button>
    </div>

    <div th:fragment="logout-button-post" id="login-container">
        <h4>Logged in as <span sec:authentication="name"></span>.</h4>
        <button hx-post="/logout" hx-target="#login-container" hx-swap="outerHTML" class="btn-primary">Logout</button>
    </div>

    <div th:fragment="login-button" id="login-container">
        <p>Please log in to comment.</p>
        <button onclick="openDialog('login-modal')" class="btn-primary">Login</button>
        <small th:if="${param.logout != null}" th:text="${logout}"></small>
    </div>


    <dialog th:fragment="login-dialog" id="login-modal" th:open="${loginError}" aria-labelledby="login-dialog-title" tabindex="-1">
        <article th:replace="~{components/auth-components::login-article}"></article>
    </dialog>

    <article th:fragment="login-article" id="login-article">
        <header>
            <span id="login-dialog-title">Login</span>
            <button aria-label="Close" onclick="closeDialog('login-modal')" class="close-btn btn-primary">X</button>
        </header>
        <form role="form" aria-label="Login form" hx-post="/login" hx-target="#login-container" hx-swap="outerHTML" method="post" hx-on::after-request="if(event.detail.successful) closeDialog('login-modal')">
            <label>
                Username:
                <input type="text" name="username" placeholder="Username" required th:aria-invalid="${loginError}"/>
            </label>
            <label>
                Password:
                <input type="password" name="password" placeholder="Password" required th:aria-invalid="${loginError}"/>
            </label>
            <input type="submit" value="Sign In" class="btn-primary"/>
        </form>
        <small th:if="${loginError}" class="error">Invalid username or password.</small>
    </article>

    <span th:fragment="csrf-token" id="csrf-token" th:data-token="${_csrf.token}" th:data-header="${_csrf.headerName}"></span>

    <span th:fragment="csrf-token-oob" id="csrf-token" th:data-token="${_csrf.token}" th:data-header="${_csrf.headerName}" hx-swap-oob="true"></span>

</body>
</html>
