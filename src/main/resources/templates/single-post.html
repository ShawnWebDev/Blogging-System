<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
    <script src="/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/main.css">
    <title th:replace="~{blog::blog-title}"></title>
</head>
<body>

    <header th:replace="~{components/header-components :: full-header}"></header>

    <main th:fragment="single-post" id="main-content">

        <section>
            <button sec:authorize="hasAuthority('ADMIN')" th:hx-get="@{/blog/editPost/{id}(id=${entry.id})}" hx-target="#main-content" hx-swap="outerHTML">Edit</button>
            <p>Single Post Page..</p>
        </section>


        <!-- todo: needs comments section component-->
        <section>
            <h4>Figure out where to put this later...</h4>
            <div sec:authorize="isAuthenticated()" th:replace="~{components/auth-components::logout-button}"></div>
            <div sec:authorize="isAnonymous()" th:replace="~{components/auth-components::login-button}"></div>
        </section>
    </main>



</body>
</html>
