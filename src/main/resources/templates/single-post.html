<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{components/shared-head}"></head>

<body>

    <header th:replace="~{components/header-components :: full-header}"></header>

    <main>
        <div th:fragment="single-post" id="main-content" hx-on:htmx:load="initSidebar()">
            <header id="post-header">
                <div id="post-header-content">
                    <img th:if="${!entry.thumbnailUrl.isBlank()}" th:src="${entry.thumbnailUrl}" th:alt="${entry.thumbnailAlt}" class="post-thumbnail"/>
                    <h1 th:text="${entry.title}" id="entry-title"></h1>
                </div>
                <div id="single-post-navigation-container">
                    <div>
                        <th:block th:each="category : ${entry.categoryNames}">
                            <button th:hx-get="@{/blog/blogComponent/posts(categoryName=${category})}" hx-target="#main-content" hx-swap="outerHTML swap:150ms" th:text="${category}"
                                    th:title="'View all posts in ' + ${category} + '.'" th:aria-label="'View all posts in ' + ${category} + ', navigates to blog dashboard.'" class="btn-secondary"></button>
                        </th:block>
                    </div>
                    <p th:if="${entry.categoryNames.size() == 0}">No associated categories.</p>
                    <button hx-get="/blog" hx-swap="outerHTML swap:150ms" hx-target="#main-content" class="btn-secondary"
                            title="Back to blog dashboard." aria-label="Navigates to blog dashboard.">Back To Blog</button>
                </div>
            </header>

            <noscript>
                <th:block th:replace="~{components/auth-components::noscript}"></th:block>
            </noscript>

            <article id="post-content">
                <section th:utext="${entry.content}" id="post-text"></section>

                <aside id="sidebar">
                    <nav id="sidebar-menu"></nav>
                </aside>
            </article>

            <section th:replace="~{components/post-components::admin-buttons(${entry.id})}"></section>

            <div id="error-field"></div>

            <section id="auth-section">
                <div sec:authorize="isAuthenticated()" th:replace="~{components/auth-components::logout-button-post}"></div>
                <div sec:authorize="isAnonymous()" th:replace="~{components/auth-components::login-button-post}"></div>
                <div th:replace="~{components/auth-components::refreshCsrf}"></div>
                <span th:replace="~{components/auth-components::csrf-token}" id="csrf-token"></span>
            </section>

            <section th:replace="~{components/comment-components::comment-section}" id="comments-section"></section>

        </div>
    </main>

</body>
</html>
