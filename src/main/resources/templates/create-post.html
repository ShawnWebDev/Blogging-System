<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/htmx.min.js" defer></script>
  <link rel="stylesheet" href="/main.css">
  <title>Create Post</title>
</head>
<body>

  <header th:replace="~{components/header-components :: full-header}"></header>

  <main id="main-content">

    <section th:fragment="create-post" id="create-post-form" th:attr="data-next-index=${post.contentBlocks.size()}">

      <form action="#" hx-post="/blog/createPost" th:object="${post}" hx-target="#create-post-form" hx-swap="outerHTML">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Title:
          <input type="text" th:field="*{title}" required/>
          <small th:errors="*{title}" th:text="${#fields.errors('title')}" class="error"></small>
        </label>
        <label>Description:
          <textarea type="text" th:field="*{description}" required></textarea>
          <small th:errors="*{description}" th:text="${#fields.errors('description')}" class="error"></small>
        </label>
        <div class="form-group">
          <label>Thumbnail URL:
            <input type="text" th:field="*{thumbnailUrl}" required/>
            <small th:errors="*{thumbnailUrl}" th:text="${#fields.errors('thumbnailUrl')}" class="error"></small>
          </label>
          <label>Thumbnail Alt:
            <input type="text" th:field="*{thumbnailAlt}" required/>
            <small th:errors="*{thumbnailUrl}" th:text="${#fields.errors('thumbnailUrl')}" class="error"></small>
          </label>
        </div>

        <fieldset class="form-group">
          <legend>Categories <small>(one minimum)</small>:</legend>
          <select th:field="*{categories[0]}">
            <option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.name}"></option>
          </select>
          <select th:field="*{categories[1]}">
            <option value="0">None</option>
            <option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.name}"></option>
          </select>
          <select th:field="*{categories[2]}">
            <option value="0">None</option>
            <option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.name}"></option>
          </select>
          <select th:field="*{categories[3]}">
            <option value="0">None</option>
            <option th:each="category : ${categoryList}" th:value="${category.id}" th:text="${category.name}"></option>
          </select>
        </fieldset>

        <fieldset id="blocks-container">
          <legend>Content Blocks:</legend>
          <th:block th:each="block, iter : ${post.contentBlocks}">
            <div th:replace="~{components/post-components::content-block(${iter.index}, ${block})}"></div>
          </th:block>
        </fieldset>
        <div>
          <div id="byte-count"></div>
          <button type="button" id="add-block-btn"
                  hx-get="/blog/postComponent/addBlock"
                  hx-vals='js:{index: document.getElementById("create-post-form").dataset.nextIndex++}'
                  hx-target="#blocks-container"
                  hx-swap="beforeend">
            + Add Content Block</button>
          <div style="display: none;" id="byte-validator"
               hx-post="/blog/postComponent/validateSize"
               hx-trigger="block-removed, load, keyup from:#blocks-container changed delay:400ms"
               hx-target="#byte-count"
               hx-include="closest form"></div>
        </div>
        <div id="blog-error"></div>
        <input type="submit" value="Create Post">
      </form>
    </section>

  </main>

</body>
</html>
