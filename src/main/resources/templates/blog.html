<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/pico.fluid.classless.conditional.jade.min.css">
    <title>Blog</title>
</head>

<body class="pico">

    <header th:replace="components/header-components :: full-header"></header>

    <main th:fragment="blog-main" id="main-content" hx-swap-oob="true">
        <section id="categories">
            <hr>
            <h2>Search by category:</h2>
            <div>
                <div th:each="category : ${categories}">

                </div>
            </div>
            <hr>
        </section>

        <section th:replace="~{components/blog-components :: all-posts}" id="posts"></section>
    </main>

</body>
</html>
