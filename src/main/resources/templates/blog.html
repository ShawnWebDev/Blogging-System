<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
    <script src="/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/main.css">
    <title th:fragment="blog-title">Shawn's Blog</title>
</head>

<body>
    <div id="template">
        <header th:replace="~{components/header-components :: full-header}"></header>

        <main th:fragment="blog-main" id="main-content">
            <h1>Blog</h1>
            <section id="categories">
                <header>
                    <h2>Filter Posts By Category:</h2>
                </header>
                <div id="categories-container">
                    <button class="category-selection"
                             th:each="category : ${categories}"
                             th:hx-get="@{/blog/blogComponent/posts(categoryName=${category.categoryName})}"
                             hx-target="#posts"
                             hx-swap="outerHTML swap:200ms"
                             th:text="${category.categoryName}">
                    </button>
                </div>
            </section>

            <section th:replace="~{components/blog-components :: all-posts}" id="posts"></section>

            <section>
                <h4>Figure out where to put this later...</h4>
                <div sec:authorize="isAuthenticated()" th:replace="~{components/auth-components::logout-button}"></div>
                <div sec:authorize="isAnonymous()" th:replace="~{components/auth-components::login-button}"></div>
            </section>
        </main>
    </div>
</body>
</html>
