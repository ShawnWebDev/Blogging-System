<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{components/shared-head}"></head>

<body>
    <div id="template">
        <header th:replace="~{components/header-components :: full-header}"></header>

        <main th:fragment="blog-main" id="main-content">
            <h1>Blog</h1>
            <section id="categories">
                <header>
                    <h2>Filter Posts By Category:</h2>
                </header>
                <div id="categories-container">
                    <button class="category-selection btn-primary"
                             th:each="category : ${categories}"
                             th:hx-get="@{/blog/blogComponent/posts(categoryName=${category.categoryName})}"
                             hx-target="#posts"
                             hx-swap="outerHTML swap:200ms"
                             th:text="${category.categoryName}">
                    </button>
                </div>
                <script>
                    document.getElementById('categories-container').addEventListener('click', function (e) {
                        const target = e.target.closest('.category-selection');
                        if (target) {
                            document.querySelectorAll('.category-selection').forEach(el => el.classList.remove('activeCategory'));
                            target.classList.add('activeCategory');
                        }
                    });
                </script>
            </section>

            <section th:replace="~{components/blog-components :: all-posts}" id="posts"></section>

        </main>
    </div>

</body>
</html>
