<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/htmx.min.js" defer></script>
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/pico.classless.jade.min.css">
    <title>Blog</title>
</head>

<body>

    <header th:replace="~{components/header-components :: full-header}"></header>

    <main th:fragment="blog-main" id="main-content">
        <hr>
        <h3>Search By Category:</h3>
        <a href="#" hx-get="/blog/blogComponent/posts" hx-target="#posts" hx-swap="innerHTML swap:200ms">All Posts</a>
        <section id="categories">
            <article class="category-selection"
                     th:each="category : ${categories}"
                     th:hx-get="@{/blog/blogComponent/posts(category=${category.categoryName})}"
                     hx-target="#posts"
                     hx-swap="innerHTML swap:200ms">
                <header>
                    <h6 th:text="${category.categoryName}"></h6>
                </header>
                <small th:text="${category.description}"></small>
            </article>
        </section>
        <hr>
        <section th:replace="~{components/blog-components :: all-posts}" id="posts"></section>
    </main>

</body>
</html>
