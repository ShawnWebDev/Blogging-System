spring.application.name=BloggingSystem
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${MARIADB_DATASOURCE_URL}
spring.datasource.username=${MARIADB_USERNAME}
spring.datasource.password=${MARIADB_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=shawns.portfolio.blog@gmail.com
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.web.error.path=/error

spring.datasource.hikari.maximum-pool-size=5

## if a state changing request happens after expiration, re-direct to /blog?sessionExpired and inform user to log in again.
server.servlet.session.timeout=60m

## todo: check MariaDB wait-timeout and set these accordingly (MariaDB properties are in seconds, HikariCP is in millisecond
## spring.datasource.hikari.connection-timeout=20000 --20sec
## spring.datasource.hikari.max-lifetime=600000 --600sec/10min
## spring.datasource.hikari.keepalive-time=60000 --60sec/1min

logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG